services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: e-market-api:latest
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: e-market-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    restart: unless-stopped

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo-data:
    name: e-market-mongo-data